name: Get Citation Data
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Citation data source
        type: choice
        options: [auto, scholar, openalex]
        default: scholar
  push:
    branches: [main]
    paths:
      - '.github/workflows/google_scholar_crawler.yaml'
      - 'google_scholar_crawler/**'
permissions:
  contents: write
concurrency:
  group: citation-data-main
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r google_scholar_crawler/requirements.txt
          python -m pip check
      - name: Regression tests
        run: python -m unittest discover -s google_scholar_crawler -p 'test_*.py' -v
      - name: Fetch citations
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          GOOGLE_SCHOLAR_PROXY: ${{ secrets.GOOGLE_SCHOLAR_PROXY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          ORCID_ID: ${{ vars.ORCID_ID }}
          CITATION_OPENALEX_FALLBACK: ${{ vars.CITATION_OPENALEX_FALLBACK || 'true' }}
          SCHOLAR_TIMEOUT: ${{ vars.SCHOLAR_TIMEOUT || '90' }}
          CITATION_SOURCE: ${{ inputs.source || vars.CITATION_SOURCE || 'auto' }}
        run: python google_scholar_crawler/main.py --source "$CITATION_SOURCE" --out _data
      - name: Validate snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          data = json.loads(Path('_data/gs_data.json').read_text(encoding='utf-8'))
          badge = json.loads(Path('_data/gs_data_shieldsio.json').read_text(encoding='utf-8'))
          assert data['citation_source'] in ('google_scholar', 'openalex')
          assert type(data['citedby']) is int and data['citedby'] >= 0
          assert isinstance(data['publications'], dict)
          datetime.strptime(data['updated'], '%Y-%m-%d %H:%M:%S')
          assert badge['message'] == str(data['citedby'])
          print(data['citation_source'], data['citedby'], data['updated'])
          PY
      - name: Commit citation snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- _data/gs_data.json _data/gs_data_shieldsio.json
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Update citation data'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              exit 1
            fi
            sleep "$attempt"
          done
          exit 1
